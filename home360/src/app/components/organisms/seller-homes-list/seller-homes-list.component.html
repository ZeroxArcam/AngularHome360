<section class="property-list">
  <div class="property-list__table-container">
    <div class="header-with-filter">
      <h2 class="header-with-filter__title">Horarios de Propiedades Registradas</h2>
    </div>
    <table class="property-list__table">
      <thead class="property-list__table-head">
        <tr>
          <th class="property-list__table-header"> Nombre</th>
          <th class="property-list__table-header">Dirección</th>

          <th class="property-list__table-header">Ciudad</th>
          <th class="property-list__table-header">Departamento</th>
          <th class="property-list__table-header">Acciones</th>
        </tr>
      </thead>
      <tbody class="property-list__table-body" *ngIf="propertiesDto$ | async as propertiesList">
        <tr *ngFor="let property of propertiesList.items" class="property-list__table-row">
          <td class="property-list__table-data">
            <div class="property-name">{{ property.name }}</div>
            <div class="property-details">{{ property.neighborhood }}</div>
          </td>
          <td class="property-list__table-data">{{ property.address }}</td>
          <td class="property-list__table-data">{{ property.cityName }}</td>
          <td class="property-list__table-data">{{ property.departmentName }}</td>
          <td class="property-list__table-data">
            <button class="btn btn-primary btn-small" (click)="openScheduleModal(property.id)">
              <i class="fa-regular fa-clock btn-horario-icon"></i>
              <span class="btn-horario-text">Gestionar Horarios</span>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="property-list__pagination" *ngIf="propertiesDto$ | async as propertiesList">
    <button class="property-list__pagination-button" (click)="prevPage()"
      [disabled]="propertiesList.pageNumber === 0">&lt;</button>
    <button *ngFor="let p of (pages$ | async)" class="property-list__pagination-button" (click)="goToPage(p)"
      [class.property-list__pagination-button--active]="(page$ | async) === p">
      {{ p + 1 }}
    </button>
    <button class="property-list__pagination-button" (click)="nextPage()"
      [disabled]="propertiesList.pageNumber === propertiesList.totalPages - 1 && propertiesList.totalPages > 0">&gt;</button>
    <span *ngIf="propertiesList.totalElements !== undefined">Total {{ propertiesList.totalElements }} propiedades</span>
  </div>
</section>
<app-schedule-modal *ngIf="isScheduleModalVisible" [homeId]="selectedHomeId"
  (close)="closeScheduleModal()"></app-schedule-modal>
