<section *ngIf="pageDto$ | async as categoriesList" class="category-wrapper">
  <h2>Categorías existentes</h2>

  <table class="category-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>
          <button (click)="toggleOrder()">
            Nombre <span *ngIf="orderAscending">&#9650;</span><span *ngIf="!orderAscending">&#9660;</span>
          </button>
        </th>
        <th>Descripción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let category of categoriesList.items">
        <td>#CAT-{{ category.id }}</td>
        <td>{{ category.name }}</td>
        <td>{{ category.description }}</td>
      </tr>
    </tbody>
  </table>
  <div class="pagination">
    <button (click)="prevPage()" [hidden]="(page$ | async) === 0">&lt;</button>
    <button *ngFor="let p of (pages$ | async)" (click)="goToPage(p)" [class.active]="(page$ | async) === p">
      {{ p + 1 }}
    </button>
    <button (click)="nextPage()" *ngIf="totalPages$ | async as totalPages"
      [hidden]="totalPages === 0 || (page$ | async) === totalPages - 1">
      &gt;
    </button>
  </div>
</section>
