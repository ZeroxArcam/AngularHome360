<h2 class="create-category-form__title">Crear Categoría</h2>
<div class="create-category-form__container">

  <form [formGroup]="categoryForm" (ngSubmit)="handleCreateCategory()" class="create-category-form__form">

    <div class="create-category-form__field">
      <app-textarea-field formControlName="categoryName" id="categoryName" labelText="Nombre de la Categoría"
        [placeholder]="'Escribe el nombre de la categoría (máximo 50 caracteres)'" [required]="true" [maxlength]="50"
        [showCharacterCount]="false" [textareaClass]="'input-like'">
      </app-textarea-field>
    </div>

    <div class="create-category-form__field">
      <app-textarea-field formControlName="categoryDescription" id="categoryDescription" labelText="Descripción"
        placeholder="Ingrese la descripción de la categoría" [required]="true" [maxlength]="90"
        [textareaClass]="'no-resize'">
      </app-textarea-field>
    </div>

    <div class="create-category-form__actions">
      <app-button buttonText="Crear" [isPrimary]="true" type="submit"></app-button>
    </div>
  </form>

  <div *ngIf="creationResult$ | async as result" class="create-category-form__snackbar"
    [ngClass]="{ 'create-category-form__snackbar--success': result?.success, 'create-category-form__snackbar--error': result?.error }">
    {{ result?.message || result?.error }}
  </div>
</div>
