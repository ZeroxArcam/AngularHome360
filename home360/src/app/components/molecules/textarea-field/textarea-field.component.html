<div class="textarea-field">
  <app-label [for]="inputId" [labelText]="labelText" [isRequired]="required"></app-label>
  <div class="textarea-field__wrapper" [class.textarea-field__wrapper--error]="hasExceededMaxLength()">

    <app-textarea #textAreaInput [id]="inputId" [name]="name" [placeholder]="placeholder" [required]="required"
      [textareaClass]="textareaClass" [value]="value" [maxlength]="maxlength" [attr.pattern]="pattern || null"
      [attr.inputmode]="inputmode || null" (input)="handleInputChange($event)"
      [restrictToNumbers]="restrictToNumbers"></app-textarea>

    <div class="textarea-field__character-count" *ngIf="showCharacterCount && maxlength">
      {{ currentValueLength }} / {{ maxlength }}
    </div>
  </div>

  <div *ngIf="errorMessage" class="textarea-field__error-message">
    {{ errorMessage }}
  </div>
  <ng-content></ng-content>
</div>
