<aside class="dashboard-sidebar">
  <ul class="dashboard-sidebar__nav-list">
    <li class="dashboard-sidebar__nav-item" *ngFor="let item of menuItems$ | async"
      routerLinkActive="dashboard-sidebar__nav-item--active"
      [routerLinkActiveOptions]="{ exact: item.exactMatch || false }">
      <a [routerLink]="item.route" class="dashboard-sidebar__nav-link">
        <i class="dashboard-sidebar__nav-icon" [ngClass]="item.icon"></i>
        <span class="dashboard-sidebar__nav-text">{{ item.label }}</span>
      </a>
    </li>
  </ul>
</aside>
