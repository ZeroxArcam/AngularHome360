<textarea [id]="id" [name]="name" [placeholder]="placeholder" [required]="required" [value]="value" class="textarea"
  [class]="textareaClass" [attr.maxlength]="maxlength" (input)="handleInput($event)"
  (keypress)="restrictToNumbers ? allowOnlyNumbers($event) : null" style="resize: none;">
</textarea>
